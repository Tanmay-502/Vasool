name: Holdout Evaluation

on:
  workflow_dispatch:
    inputs:
      min_precision:
        description: "Minimum precision (0-1)"
        required: false
        # Recovery can trigger real provider-side actions, so precision is
        # deliberately stricter than the historical frozen score. A 0.60
        # floor is a meaningful false-positive safety margin.
        default: "0.60"
      min_recall:
        description: "Minimum recall (0-1)"
        required: false
        # Recall remains high, but 0.90 leaves room for safe escalation
        # instead of trading away precision just to preserve every candidate.
        default: "0.90"

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.VASOOL_EVAL_DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MIN_PRECISION: ${{ inputs.min_precision }}
      MIN_RECALL: ${{ inputs.min_recall }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Score frozen holdout split
        id: score
        continue-on-error: true
        working-directory: backend
        run: python -m scripts.evaluate_holdout | tee holdout-output.txt
      - name: Enforce precision and recall floor
        id: gate
        working-directory: backend
        shell: python
        continue-on-error: true
        run: |
          import os, re, sys
          from pathlib import Path

          min_precision = float(os.environ["MIN_PRECISION"])
          min_recall = float(os.environ["MIN_RECALL"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

          if not Path("holdout-output.txt").exists():
              summary.write_text(
                  "## Holdout quality gate\n\n"
                  "⚠️ **NOT RUN** — the scoring step did not produce holdout-output.txt. "
                  "This commonly means the evaluation DB secret is unavailable.\n",
                  encoding="utf-8",
              )
              raise SystemExit(1)

          text = Path("holdout-output.txt").read_text(encoding="utf-8")
          precision_match = re.search(r"Precision:\s*([0-9.]+)%", text)
          recall_match = re.search(r"Recall:\s*([0-9.]+)%", text)
          if not precision_match or not recall_match:
              summary.write_text(
                  "## Holdout quality gate\n\n"
                  "❌ **FAIL** — holdout output did not contain parseable precision/recall.\n",
                  encoding="utf-8",
              )
              raise SystemExit(1)

          precision = float(precision_match.group(1)) / 100
          recall = float(recall_match.group(1)) / 100
          passed = precision >= min_precision and recall >= min_recall

          print(f"precision={precision:.4f} floor={min_precision:.4f}")
          print(f"recall={recall:.4f} floor={min_recall:.4f}")
          summary.write_text(
              "## Holdout quality gate\n\n"
              f"| Metric | Observed | Floor |\n"
              f"|---|---:|---:|\n"
              f"| Precision | {precision:.4f} | {min_precision:.4f} |\n"
              f"| Recall | {recall:.4f} | {min_recall:.4f} |\n\n"
              f"**Result: {'PASS' if passed else 'FAIL'}**\n",
              encoding="utf-8",
          )
          if not passed:
              raise SystemExit(1)
